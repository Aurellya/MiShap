name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean install

      - name: Check demo specs (expected exit codes 1, 1, 0)
        run: |
          check() {  # file expected_exit_code
            set +e
            java -jar mishap-cli/target/mishap.jar check "mishap-demo/src/main/resources/specs/$1" > /dev/null
            code=$?
            set -e
            if [ "$code" -ne "$2" ]; then
              echo "FAIL $1: exit $code, expected $2"; exit 1
            fi
            echo "OK   $1 (exit $code)"
          }
          check order-checkout-v1-buggy.mishap 1
          check order-checkout-v2-partial.mishap 1
          check order-checkout-v3-fixed.mishap 0

      - name: Generate v3 and compile the generated services
        run: |
          java -jar mishap-cli/target/mishap.jar generate \
            mishap-demo/src/main/resources/specs/order-checkout-v3-fixed.mishap generated-out/v3
          mvn -B -f generated-out/v3/pom.xml package -DskipTests